<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装備取得効率計算ツール</title>
  <script src="https://cdn.jsdelivr.net/npm/javascript-lp-solver/prod/solver.min.js"></script>
  <link rel="stylesheet" href="styles/equipment-planner.css">
  <link rel="stylesheet" href="styles/common.css">
</head>
<body>
<header>
  <p>TRICKCAL / EQUIPMENT PLANNER</p>
  <h1>装備取得効率計算</h1>
</header>
<nav class="tool-nav" aria-label="ツール間の移動">
  <div class="tool-nav-inner">
    <span class="tool-nav-brand">TRICKCAL TOOLS</span>
    <a href="apostle_equipment.html">装備管理</a>
    <a href="equipment_calc.html">必要量計算</a>
    <a href="equipment_planner.html" aria-current="page">周回計画</a>
    <a href="export.html">データ保存</a>
  </div>
</nav>
<main>

<div class="card" data-style="s001">
  <p data-style="s002">まず<strong>必要量計算</strong>で装備の必要数を設定することを強くお勧めします。使徒の装備状況に基づいて必要数を計算したい場合は<strong>装備管理</strong>に使徒の装備データを追加してください。</p>
</div>

<!-- Target counts -->
<div class="card">
  <h2 data-step="01">必要個数入力</h2>
  <div id="targetsGrid"></div>
</div>

<!-- Calculate -->
<div class="card">
  <h2 data-step="02">最適化計算</h2>
  <p data-style="s003">上の目標個数を設定し、計算モードを1つ選んでから計算実行ボタンを押してください。</p>
  <div id="calcModeGrid" data-style="s004">
    <label data-style="s005">
      <input type="radio" name="calcMode" value="normal" checked onchange="onCalcModeChange()" data-style="s006">
      <span><b data-style="s007">通常モード</b> — 余りの発生を許容し、要求数を満たす最小の周回数を計算します。余りが避けられない場合はその内容を表示します。</span>
    </label>
    <label data-style="s005">
      <input type="radio" name="calcMode" value="advanced" onchange="onCalcModeChange()" data-style="s006">
      <span><b data-style="s007">詳細モード</b> — 余りを許容しつつ、ランクごとのスコアに応じたペナルティを周回数に加えて最小化します（下のスコアで調整）。</span>
    </label>
    <label data-style="s005">
      <input type="radio" name="calcMode" value="no-extra" onchange="onCalcModeChange()" data-style="s006">
      <span><b data-style="s007">余り禁止モード</b> — 余りを一切許容せず、要求数にできるだけ近づく周回数を計算します。要求数に届かない場合はその内容を表示します。</span>
    </label>
  </div>
  <div id="rankScoreGrid" data-style="s008"></div>
  <button class="calc-btn" id="calcBtn" disabled onclick="runCalc()">計算実行</button>
  <div id="calcResult" data-style="s009"></div>
</div>

<!-- Stage list (accordion) -->
<div class="card">
  <details>
    <summary class="accordion-summary">ステージ一覧</summary>
    <div id="stageTableWrap" class="tbl-wrap" data-style="s010">
      <p class="placeholder">データを読み込むと表示されます</p>
    </div>
  </details>
</div>

<!-- Distribution table (accordion) -->
<div class="card">
  <details>
    <summary class="accordion-summary">アイテム分布（ステージ × 装備種類）</summary>
    <div id="distTableWrap" class="tbl-wrap" data-style="s010">
      <p class="placeholder">データを読み込むと表示されます</p>
    </div>
  </details>
</div>

<script>
// ─── 固定データ ───────────────────────────────────────────
const ITEM_TYPES = ['物理武器', '魔法武器', '鎧', '帽子', '煌めく装飾品', 'ブーツ', '華麗な装飾品'];
const EMOJI_TYPES = ['⚔️', '🪄', '👕', '🎩', '💍', '👢', '📿'];
const DEFAULT_MIN8    = [60, 40, 100, 100, 100, 100, 100];
const DEFAULT_TARGETS = DEFAULT_MIN8.map(v => Math.round(v * 2.6));

// ─── パース ───────────────────────────────────────────────
function parseItem(str) {
  str = str.trim();
  const uscore = str.indexOf('_');
  if (uscore === -1) return null;
  const id = parseInt(str.slice(0, uscore));
  const typeAndRank = str.slice(uscore + 1);
  // ランクは末尾の連続する数字
  const m = typeAndRank.match(/(\d+)$/);
  if (!m) return null;
  const rank = parseInt(m[1]);
  const type = typeAndRank.slice(0, typeAndRank.length - m[1].length);
  return { id, type, rank };
}

function parseData(text) {
  const stages = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line) continue;
    // タブ区切り、または2文字以上のスペース区切りに対応
    const parts = line.split(/\t+|[ ]{2,}/);
    if (parts.length < 3) continue;
    const stage = parts[0].trim();
    const drop1 = parseItem(parts[1]);
    const drop2 = parseItem(parts[2]);
    if (drop1 && drop2) stages.push({ stage, id: `stage_${stages.length}`, drops: [drop1, drop2] });
  }
  return stages;
}

// ─── 分析 ─────────────────────────────────────────────────
function analyzeData(stages) {
  // 最高ランク・最低ランクを検出（目標入力グリッドの範囲に使用）
  let maxRank = 0, minRank = Infinity;
  for (const s of stages)
    for (const d of s.drops) {
      if (d.rank > maxRank) maxRank = d.rank;
      if (d.rank < minRank) minRank = d.rank;
    }
  return { minRank, maxRank };
}

// ─── 描画: ステージ一覧 ───────────────────────────────────
function renderStageTable(stages, maxRank) {
  let h = '<table><thead><tr><th>ステージ</th><th>ドロップ1</th><th>ドロップ2</th></tr></thead><tbody>';
  for (const s of stages) {
    const fmt = d => {
      const cls = d.rank === maxRank ? 'r9' : 'r8';
      const label = getTypeLabel(ITEM_TYPES.indexOf(d.type));
      return `<span class="${cls}">${label}&nbsp;R${d.rank}</span>`;
    };
    h += `<tr><td>${s.stage}</td><td>${fmt(s.drops[0])}</td><td>${fmt(s.drops[1])}</td></tr>`;
  }
  h += '</tbody></table>';
  document.getElementById('stageTableWrap').innerHTML = h;
}

// ─── 描画: 分布テーブル ───────────────────────────────────
function renderDistTable(stages, maxRank, lowerRank) {
  let h = '<table><thead><tr><th>ステージ</th>';
  ITEM_TYPES.forEach((t, i) => { h += `<th>${getTypeLabel(i)}</th>`; });
  h += '</tr></thead><tbody>';

  for (const s of stages) {
    h += `<tr><td>${s.stage}</td>`;
    for (const t of ITEM_TYPES) {
      const drops = s.drops.filter(d => d.type === t);
      if (drops.length === 0) {
        h += '<td class="r-dash">－</td>';
      } else {
        const cells = drops.map(d => {
          const cls = d.rank === maxRank ? 'r9' : 'r8';
          return `<span class="${cls}">R${d.rank}</span>`;
        });
        h += `<td>${cells.join(' ')}</td>`;
      }
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  document.getElementById('distTableWrap').innerHTML = h;
}

// ─── 表示ラベル（絵文字付き） ─────────────────────────────
function getTypeLabel(i) {
  return `${EMOJI_TYPES[i]} ${ITEM_TYPES[i]}`;
}

// ─── 必要個数入力（ランク × 装備種類） ───────────────────────
function buildTargetInputs(minRank, maxRank) {
  const grid = document.getElementById('targetsGrid');

  // リセットボタン（この表内の数値入力をすべて0にします）
  let h = '';
  h += '<div data-style="s011">';
  h += '<button type="button" onclick="importEquipmentCalc()" data-style="s012">必要量計算の結果をインポート</button>';
  h += '<button type="button" onclick="resetTargets()" data-style="s013">リセット</button>';
  h += '<span data-style="s014">どちらも現在の数値は消去されます</span>';
  h += '</div>';
  h += '<p data-style="s015">※ ここで非表示にしたランクの装備設計図は0として計算されます。</p>';

  h += '<div data-style="s016">';
  for (let r = maxRank; r >= minRank; r--) {
    h += `<button type="button" class="rank-toggle on" id="rankVis_${r}" data-on="true" onclick="onRankVisChange(${r})">Rank${r}</button>`;
  }
  h += '</div>';

  h += '<div class="tbl-wrap"><table data-style="s017"><thead><tr>';
  h += '<th data-style="s018">装備ランク</th>';
  ITEM_TYPES.forEach((t, i) => { h += `<th id="typeLabel_${i}">${getTypeLabel(i)}</th>`; });
  h += '</tr></thead><tbody>';
  for (let r = maxRank; r >= minRank; r--) {
    h += `<tr id="rankRow_${r}"><td data-style="s018">Rank ${r}</td>`;
    ITEM_TYPES.forEach((t, i) => {
      const def = r === maxRank ? DEFAULT_TARGETS[i] : (r === maxRank - 1 ? DEFAULT_MIN8[i] : 0);
      h += `<td><input type="number" class="tgt-input" id="req_${i}_${r}" value="${def}" min="0" step="1"></td>`;
    });
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  grid.innerHTML = h;
}

// リセット：この `targetsGrid` 内の数値入力をすべて0にする
function resetTargets() {
  const grid = document.getElementById('targetsGrid');
  if (!grid) return;
  const inputs = grid.querySelectorAll('input[type="number"]');
  inputs.forEach(inp => {
    try {
      inp.value = 0;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (e) {}
  });
  if (typeof saveFormState === 'function') saveFormState();
}

// equipment_calc.html の「02: 設計図の必要数および保有数」を目標個数へ反映する
function importEquipmentCalc() {
  const EQUIPMENT_CALC_STORAGE_KEY = 'trickcal_equipment_plan';
  let state;
  try { state = JSON.parse(localStorage.getItem(EQUIPMENT_CALC_STORAGE_KEY)); } catch (e) { state = null; }
  if (!state || typeof state !== 'object') {
    alert('equipment_calc の保存データが見つかりません。先に equipment_calc.html で必要数を入力してください。');
    return;
  }

  const getSavedNumber = (group, i, rank) => Math.max(0, parseFloat((group || {})[`${i}_${rank}`]) || 0);
  const blueprintTotals = {};
  for (let i = 0; i < ITEM_TYPES.length; i++) {
    blueprintTotals[i] = {};
    for (let rank = 2; rank <= 9; rank++) blueprintTotals[i][rank] = 0;
  }
  for (let i = 0; i < ITEM_TYPES.length; i++) {
    for (let targetRank = 2; targetRank <= 9; targetRank++) {
      const equipmentCount = getSavedNumber(state.req01, i, targetRank);
      const recipe = REQUIREMENTS_BY_TARGET_RANK[targetRank];
      if (!equipmentCount || !recipe) continue;
      for (const [blueprintRank, amount] of Object.entries(recipe)) {
        blueprintTotals[i][blueprintRank] += equipmentCount * amount;
      }
    }
  }

  const { minRank, maxRank } = currentAnalysis || {};
  if (minRank === undefined || maxRank === undefined) return;
  for (let i = 0; i < ITEM_TYPES.length; i++) {
    for (let rank = minRank; rank <= maxRank; rank++) {
      const input = document.getElementById(`req_${i}_${rank}`);
      if (!input) continue;
      const need = (blueprintTotals[i][rank] || 0) - getSavedNumber(state.own02, i, rank);
      input.value = Math.max(0, need);
    }
  }
  for (let rank = minRank; rank <= maxRank; rank++) setRankVis(rank, true);
  saveFormState();
}

// ON/OFF状態を直接設定（トグルではなく状態復元にも使う）
function setRankVis(r, on) {
  const btn = document.getElementById(`rankVis_${r}`);
  const row = document.getElementById(`rankRow_${r}`);
  if (btn) {
    btn.dataset.on = on ? 'true' : 'false';
    btn.classList.toggle('on', on);
    btn.classList.toggle('off', !on);
    btn.textContent = `Rank ${r}`;
  }
  if (row) row.style.display = on ? '' : 'none';
}

function onRankVisChange(r) {
  const btn = document.getElementById(`rankVis_${r}`);
  if (!btn) return;
  setRankVis(r, btn.dataset.on === 'false');
  saveFormState();
}

function getRequiredAmount(i, rank) {
  const visBtn = document.getElementById(`rankVis_${rank}`);
  if (visBtn && visBtn.dataset.on === 'false') return 0; // OFFのランクは入力値を保持しつつ計算上は0扱い
  const el = document.getElementById(`req_${i}_${rank}`);
  return el ? (parseFloat(el.value) || 0) : 0;
}

// 全ランク × 全装備種類の目標一覧を取得
function getAllTargets(minRank, maxRank) {
  const list = [];
  for (let r = minRank; r <= maxRank; r++) {
    for (let i = 0; i < ITEM_TYPES.length; i++) {
      const t = ITEM_TYPES[i];
      list.push({ type: t, rank: r, key: `${t}_${r}`, target: getRequiredAmount(i, r) });
    }
  }
  return list;
}

// ペナルティ調整モード用: ランクごとの「余りスコア」(-1000〜100) を 1個あたりのペナルティに変換
function getRankScore(r) {
  const el = document.getElementById(`rankScore_${r}`);
  let v = el ? parseFloat(el.value) : 0;
  if (isNaN(v)) v = 0;
  return Math.max(-1000, Math.min(100, v));
}
function penaltyForRank(r) {
  return (100 - getRankScore(r)) / 100;
}

function buildRankScoreInputs(minRank, maxRank) {
  let h = '<div data-style="s019">数字が大きいほど余りとして使われやすくなります。100だと余ることのペナルティは無くなり、マイナスの値だとペナルティが強まりこの装備ランクで余りを作ることを避けます。</div>';
  h += '<div data-style="s020">';
  for (let r = maxRank; r >= minRank; r--) {
    h += `<label data-style="s021">
      Rank${r}
      <input type="number" class="tgt-input" id="rankScore_${r}" data-style="s022" value="0" min="-1000" max="100" step="1">
    </label>`;
  }
  h += '</div>';
  document.getElementById('rankScoreGrid').innerHTML = h;
}

// ─── 一人分を追加 ─────────────────────────────────────────
// 装備1個をランクXまで強化するのに必要な設計図数（ランクごと。種類によらず共通）
const REQUIREMENTS_BY_TARGET_RANK = {
  9: { 9: 52, 8: 20 },
  8: { 8: 46, 7: 18 },
  7: { 7: 42 },
  6: { 6: 36, 5: 14 },
  5: { 5: 30, 4: 12 },
  4: { 4: 20 },
  3: { 3: 18, 2: 8 },
  2: { 2: 10 },
};

// ─── 入力内容の自動保存（localStorage） ───────────────────────
const FORM_STORAGE_KEY = 'trickcalTools.formState.v1';

function saveFormState() {
  const state = { req: {}, rankVis: {}, rankScore: {} };
  document.querySelectorAll('input[id^="req_"]').forEach(el => { state.req[el.id] = el.value; });
  document.querySelectorAll('[id^="rankVis_"]').forEach(el => { state.rankVis[el.id] = el.dataset.on !== 'false'; });
  document.querySelectorAll('input[id^="rankScore_"]').forEach(el => { state.rankScore[el.id] = el.value; });

  const modeRadio = document.querySelector('input[name="calcMode"]:checked');
  if (modeRadio) state.calcMode = modeRadio.value;

  try { localStorage.setItem(FORM_STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ストレージ利用不可は無視 */ }
}

function loadFormState() {
  let state;
  try { state = JSON.parse(localStorage.getItem(FORM_STORAGE_KEY)); } catch (e) { state = null; }
  if (!state) return;

  if (state.req) {
    for (const [id, val] of Object.entries(state.req)) {
      const el = document.getElementById(id);
      if (el) el.value = val;
    }
  }
  if (state.rankVis) {
    for (const [id, on] of Object.entries(state.rankVis)) {
      setRankVis(parseInt(id.slice('rankVis_'.length)), on);
    }
  }
  if (state.rankScore) {
    for (const [id, val] of Object.entries(state.rankScore)) {
      const el = document.getElementById(id);
      if (el) el.value = val;
    }
  }

  if (state.calcMode) {
    const legacyModes = { '1': 'normal', '2': 'no-extra', '3': 'advanced' };
    const calcMode = legacyModes[state.calcMode] || state.calcMode;
    const radio = document.querySelector(`input[name="calcMode"][value="${calcMode}"]`);
    if (radio) radio.checked = true;
  }
}

// 計算モードに応じてペナルティ調整モード用スコア欄の表示を切り替え
function getSelectedCalcMode() {
  const el = document.querySelector('input[name="calcMode"]:checked');
  return el ? el.value : 'normal';
}
function onCalcModeChange() {
  const grid = document.getElementById('rankScoreGrid');
  if (grid) grid.style.display = getSelectedCalcMode() === 'advanced' ? '' : 'none';
}

// ─── メイン処理 ──────────────────────────────────────────
let currentStages = null;
let currentAnalysis = null;

function getStagePosition(stage) {
  const match = stage.match(/^(\d+)-(\d+)$/);
  return match ? [Number(match[1]), Number(match[2])] : [-1, -1];
}

function getStageReward(stage) {
  const [chapter, number] = getStagePosition(stage);
  return (chapter * 100 + number) / 1_000_000_000;
}

function getStageObjective(stage, baseCost) {
  return baseCost - getStageReward(stage);
}

function isLaterStage(candidate, current) {
  const [candidateChapter, candidateNumber] = getStagePosition(candidate.stage);
  const [currentChapter, currentNumber] = getStagePosition(current.stage);
  return candidateChapter > currentChapter ||
    (candidateChapter === currentChapter && candidateNumber > currentNumber);
}

function keepLatestDuplicateDrops(stages) {
  const latestByDrops = new Map();
  for (const stage of stages) {
    const dropsKey = stage.drops
      .map(drop => `${drop.id}_${drop.type}_${drop.rank}`)
      .sort()
      .join('|');
    const current = latestByDrops.get(dropsKey);
    if (!current || isLaterStage(stage, current)) latestByDrops.set(dropsKey, stage);
  }
  return Array.from(latestByDrops.values());
}

function processData(stages) {
  currentStages = keepLatestDuplicateDrops(stages);
  currentAnalysis = analyzeData(currentStages);
  const { minRank, maxRank } = currentAnalysis;
  buildTargetInputs(minRank, maxRank);
  buildRankScoreInputs(minRank, maxRank);
  loadFormState();
  onCalcModeChange();
  document.addEventListener('input', saveFormState);
  document.addEventListener('change', saveFormState);
  renderStageTable(currentStages, maxRank);
  renderDistTable(currentStages, maxRank, maxRank - 1);
  document.getElementById('calcBtn').disabled = false;
}

// ─── ヘルパー ─────────────────────────────────────────────
function sig3(x) {
  if (Math.abs(x) < 1e-9) return '0';
  const rounded = Math.round(x);
  if (Math.abs(x - rounded) < 1e-6) return rounded.toString();
  return parseFloat(x.toFixed(3)).toString();
}
function pct(x, total) {
  if (total < 1e-9) return '—';
  return (x / total * 100).toFixed(2) + '%';
}

// ─── LP モデル構築 ──────────────────────────────────────────
// 変数:  x_{stage} … 各ステージの周回数 (≥0)
// キー:  ${type}_${rank} … 装備種類×ランクを表す識別子
//
// 最小周回数モード: 余り完全許容・周回数最小化
//   制約: Σ x_s * [drop(s)=key] ≥ target_key （目標がある項目のみ）
//   目的: min Σ x_s
//
// 過不足ゼロモード: 余り不許容・不足最小化
//   制約: Σ x_s * [drop(s)=key] + short_key = target_key （short_key ≥ 0 のため余りは発生しない）
//   目的: min Σ short_key（同点なら周回数が少ない解を優先）
//
// ペナルティ調整モード: 余り許容＋ランク別ペナルティ（最小周回数モードの修正版）
//   制約: Σ x_s * [drop(s)=key] − excess_key = target_key （excess_key ≥ 0 が余り量）
//   目的: min Σ x_s + Σ penaltyForRank(rank) * excess_key

// 要求されているがどのステージからもドロップしない項目を検出
function findUnreachableKeys(stages, targetList) {
  const supply = new Set();
  for (const s of stages) {
    for (const d of s.drops) {
      if (!ITEM_TYPES.includes(d.type)) continue;
      supply.add(`${d.type}_${d.rank}`);
    }
  }
  return targetList.filter(it => it.target > 0 && !supply.has(it.key));
}

function getStageVariableName(stage) {
  return `x_${stage.id}`;
}

// 計算結果（各ステージの周回数）から実収集量を種類×ランクごとに集計
function computeActuals(stages, result) {
  const actuals = {};
  for (const s of stages) {
    const runs = result[getStageVariableName(s)] || 0;
    if (runs <= 1e-9) continue;
    for (const d of s.drops) {
      if (!ITEM_TYPES.includes(d.type)) continue;
      const key = `${d.type}_${d.rank}`;
      actuals[key] = (actuals[key] || 0) + runs;
    }
  }
  return actuals;
}

// 表示対象の行（目標がある、または実収集量がある項目）を抽出
function buildKeyRows(targetList, actuals) {
  const rows = [];
  for (const item of targetList) {
    const actual = actuals[item.key] || 0;
    if (item.target > 0 || actual > 1e-6) {
      rows.push({ type: item.type, rank: item.rank, target: item.target, actual });
    }
  }
  rows.sort((a, b) => b.rank - a.rank || ITEM_TYPES.indexOf(a.type) - ITEM_TYPES.indexOf(b.type));
  return rows;
}

// ─── 最小周回数モード: 余り完全許容・周回数最小化 ───────────
function buildModelMinRuns(stages, activeList) {
  const constraints = {};
  const variables   = {};

  for (const item of activeList) constraints[`min_${item.key}`] = { min: item.target };

  for (const s of stages) {
    const v = { obj: getStageObjective(s.stage, 1) };
    for (const d of s.drops) {
      if (!ITEM_TYPES.includes(d.type)) continue;
      const key = `${d.type}_${d.rank}`;
      if (constraints[`min_${key}`]) v[`min_${key}`] = (v[`min_${key}`] || 0) + 1;
    }
    variables[getStageVariableName(s)] = v;
  }

  return { optimize: 'obj', opType: 'min', constraints, variables };
}

// ─── 過不足ゼロモード: 余り不許容・不足最小化 ───────────────
function buildModelMinShortfall(stages, activeList) {
  const constraints = {};
  const variables   = {};

  for (const item of activeList) constraints[`dev_${item.key}`] = { equal: item.target };

  for (const s of stages) {
    const v = { obj: getStageObjective(s.stage, 1e-3) }; // 不足量が同じなら周回数が少ない解を優先
    for (const d of s.drops) {
      if (!ITEM_TYPES.includes(d.type)) continue;
      const key = `${d.type}_${d.rank}`;
      if (constraints[`dev_${key}`]) v[`dev_${key}`] = (v[`dev_${key}`] || 0) + 1;
    }
    variables[getStageVariableName(s)] = v;
  }

  for (const item of activeList) {
    variables[`short_${item.key}`] = { obj: 1, [`dev_${item.key}`]: 1 };
  }

  return { optimize: 'obj', opType: 'min', constraints, variables };
}

// ─── ペナルティ調整モード: 余り許容＋ランク別ペナルティ ─────
function buildModelPenalizedExcess(stages, activeList) {
  const constraints = {};
  const variables   = {};

  for (const item of activeList) constraints[`dev_${item.key}`] = { equal: item.target };

  for (const s of stages) {
    const v = { obj: getStageObjective(s.stage, 1) };
    for (const d of s.drops) {
      if (!ITEM_TYPES.includes(d.type)) continue;
      const key = `${d.type}_${d.rank}`;
      if (constraints[`dev_${key}`]) v[`dev_${key}`] = (v[`dev_${key}`] || 0) + 1;
    }
    variables[getStageVariableName(s)] = v;
  }

  for (const item of activeList) {
    variables[`excess_${item.key}`] = { obj: penaltyForRank(item.rank), [`dev_${item.key}`]: -1 };
  }

  return { optimize: 'obj', opType: 'min', constraints, variables };
}

// ─── 計算結果の描画 ─────────────────────────────────────────
function renderKeyTable(rows, mode) {
  const diffLabel = mode === 'excess' ? '余り' : '不足';
  let h = `<div class="tbl-wrap"><table><thead><tr>
    <th>装備種類</th><th>ランク</th><th>目標</th><th>収集量</th><th>${diffLabel}</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    const diff    = mode === 'excess' ? (r.actual - r.target) : (r.target - r.actual);
    const flagged = diff > 0.01;
    const cls     = flagged ? (mode === 'excess' ? 'over' : 'under') : 'exact';
    h += `<tr>
      <td data-style="s018">${getTypeLabel(ITEM_TYPES.indexOf(r.type))}</td>
      <td>Rank${r.rank}</td>
      <td>${r.target}</td>
      <td>${sig3(r.actual)}</td>
      <td class="${cls}">${flagged ? sig3(diff) : '—'}</td>
    </tr>`;
  }
  h += '</tbody></table></div>';
  return h;
}

function renderStageRunsTable(stages, result) {
  const active = stages
    .map(s => ({ id: s.stage, runs: result[getStageVariableName(s)] || 0, drops: s.drops }))
    .filter(sd => sd.runs > 1e-9)
    .sort((a, b) => b.runs - a.runs);
  const totalRuns = active.reduce((s, sd) => s + sd.runs, 0);

  let h = `<h4 data-style="s023">周回するステージと周回数（非ゼロのみ、降順）</h4>`;
  h += `<div class="tbl-wrap"><table>
    <thead><tr><th>ステージ</th><th>周回数</th><th>割合</th><th>ドロップ1</th><th>ドロップ2</th></tr></thead><tbody>`;
  for (const sd of active) {
    const fmt = d => `<span class="${d.rank === currentAnalysis.maxRank ? 'r9' : 'r8'}">${getTypeLabel(ITEM_TYPES.indexOf(d.type))}&nbsp;R${d.rank}</span>`;
    h += `<tr><td>${sd.id}</td><td>${sig3(sd.runs)}</td><td>${pct(sd.runs, totalRuns)}</td><td>${fmt(sd.drops[0])}</td><td>${fmt(sd.drops[1])}</td></tr>`;
  }
  h += '</tbody></table></div>';
  return h;
}

function renderDropEstimate(totalRuns) {
  const estimatedRuns = Math.ceil(totalRuns * 1.2);
  const candyNeeded = estimatedRuns * 10;
  return `<p data-style="s024">実際のドロップはランダムです。総周回数はこれに1.2をかけた程度の数、すなわち <span data-style="s025">${estimatedRuns}</span> となります。必要キャンディ量は <span data-style="s025">${candyNeeded}</span> です。</p>`;
}

function renderMinRunsResult(res, stages, targetList) {
  let h = `<h3 class="result-h">最小周回数モード（余り許容）</h3>`;
  if (!res.feasible) {
    h += '<p data-style="s026">⚠ 計算できませんでした。</p>';
    return h;
  }
  const actuals    = computeActuals(stages, res);
  const totalRuns  = stages.reduce((s, st) => s + (res[getStageVariableName(st)] || 0), 0);
  const rows       = buildKeyRows(targetList, actuals);
  const excessRows = rows.filter(r => r.actual - r.target > 0.01);

  h += `<div class="result-summary"><div class="kv"><span>100%ドロップの場合の総周回数</span><span>${sig3(totalRuns)}</span></div></div>`;
  h += renderDropEstimate(totalRuns);
  h += excessRows.length > 0
    ? `<p data-style="s027"><span class="badge badge-unavoidable">余りが発生（不可避）</span> 要求数を満たす最小周回数の解では、以下の項目に余りが生じます。</p>`
    : `<p data-style="s027"><span class="badge badge-avoidable">余りなし</span> すべての項目がちょうど目標どおりに集まりました。</p>`;
  h += '<details class="result-acquired"><summary class="accordion-summary">詳細な獲得量</summary>';
  h += renderKeyTable(rows, 'excess');
  h += '</details>';
  h += renderStageRunsTable(stages, res);
  return h;
}

function renderNoExcessResult(res, stages, targetList) {
  let h = `<h3 class="result-h">過不足ゼロモード（余り不許容）</h3>`;
  if (!res.feasible) {
    h += '<p data-style="s026">⚠ 計算できませんでした。</p>';
    return h;
  }
  const actuals   = computeActuals(stages, res);
  const totalRuns = stages.reduce((s, st) => s + (res[getStageVariableName(st)] || 0), 0);
  const rows      = buildKeyRows(targetList, actuals);
  const shortRows = rows.filter(r => r.target - r.actual > 0.01);

  h += `<div class="result-summary"><div class="kv"><span>100%ドロップの場合の総周回数</span><span>${sig3(totalRuns)}</span></div></div>`;
  h += renderDropEstimate(totalRuns);
  h += shortRows.length > 0
    ? `<p data-style="s027"><span class="badge badge-unavoidable">要求数に未達の項目あり</span> 余りを一切出さない制約の下では、以下の項目が要求数に届きません。</p>`
    : `<p data-style="s027"><span class="badge badge-avoidable">要求数達成</span> 余りを出さずにすべての項目が目標どおりに集まりました。</p>`;
  h += '<details class="result-acquired"><summary class="accordion-summary">詳細な獲得量</summary>';
  h += renderKeyTable(rows, 'shortfall');
  h += '</details>';
  h += renderStageRunsTable(stages, res);
  return h;
}

function renderPenalizedResult(res, stages, targetList) {
  let h = `<h3 class="result-h">ペナルティ調整モード（余り許容・ランク別スコア）</h3>`;
  if (!res.feasible) {
    h += '<p data-style="s026">⚠ 計算できませんでした。</p>';
    return h;
  }
  const actuals      = computeActuals(stages, res);
  const totalRuns    = stages.reduce((s, st) => s + (res[getStageVariableName(st)] || 0), 0);
  const rows         = buildKeyRows(targetList, actuals);
  const excessRows   = rows.filter(r => r.actual - r.target > 0.01);
  const totalPenalty = excessRows.reduce((s, r) => s + (r.actual - r.target) * penaltyForRank(r.rank), 0);

  h += `<div class="result-summary">
    <div class="kv"><span>100%ドロップの場合の総周回数</span><span>${sig3(totalRuns)}</span></div>
    <div class="kv"><span>余りペナルティ合計</span><span>${sig3(totalPenalty)}</span></div>
    <div class="kv"><span>目的関数値（周回数＋ペナルティ）</span><span>${sig3(res.result || 0)}</span></div>
  </div>`;
  h += renderDropEstimate(totalRuns);
  h += excessRows.length > 0
    ? `<p data-style="s027"><span class="badge badge-unavoidable">余りが発生</span> ランク別スコアに応じたペナルティ込みで、周回数＋ペナルティを最小化した結果です。</p>`
    : `<p data-style="s027"><span class="badge badge-avoidable">余りなし</span></p>`;
  h += '<details class="result-acquired"><summary class="accordion-summary">詳細な獲得量</summary>';
  h += renderKeyTable(rows, 'excess');
  h += '</details>';
  h += renderStageRunsTable(stages, res);
  return h;
}

// ─── 計算実行 ──────────────────────────────────────────────
function runCalc() {
  if (!currentStages || !currentAnalysis) return;
  const btn       = document.getElementById('calcBtn');
  const resultDiv = document.getElementById('calcResult');
  btn.disabled    = true;
  resultDiv.innerHTML = '<p class="calc-status">⏳ 計算中...</p>';

  try {
    if (typeof solver === 'undefined') {
      throw new Error('LP Solver が読み込まれていません。インターネット接続を確認してください。');
    }
    const { minRank, maxRank } = currentAnalysis;
    const targetList = getAllTargets(minRank, maxRank);

    const unreachable    = findUnreachableKeys(currentStages, targetList);
    const unreachableSet = new Set(unreachable.map(u => u.key));
    const activeList     = targetList.filter(it => it.target > 0 && !unreachableSet.has(it.key));
    const noExcessList   = targetList;
    const penalizedList  = targetList.filter(it => !unreachableSet.has(it.key));

    let html = '';
    if (unreachable.length > 0) {
      const list = unreachable.map(u => `${getTypeLabel(ITEM_TYPES.indexOf(u.type))} Rank${u.rank}（目標${u.target}）`).join('、');
      html += `<div class="infeasible-warning">⚠ 以下の項目はどのステージからもドロップしないため、要求数を満たすことができません：${list}</div>`;
    }

    const mode = getSelectedCalcMode();
    if (mode === 'no-extra') {
      const res = solver.Solve(buildModelMinShortfall(currentStages, noExcessList));
      html += renderNoExcessResult(res, currentStages, targetList);
    } else if (mode === 'advanced') {
      const res = solver.Solve(buildModelPenalizedExcess(currentStages, penalizedList));
      html += renderPenalizedResult(res, currentStages, targetList);
    } else {
      const res = solver.Solve(buildModelMinRuns(currentStages, activeList));
      html += renderMinRunsResult(res, currentStages, targetList);
    }

    resultDiv.innerHTML = html;
  } catch (err) {
    resultDiv.innerHTML = `<p data-style="s026">エラー: ${err.message}</p>`;
    console.error(err);
  }

  btn.disabled = false;
}

// ─── 初期化 ──────────────────────────────────────────────
async function init() {
  try {
    const response = await fetch('equipment.txt');
    if (!response.ok) throw new Error(`equipment.txt の読み込みに失敗しました (${response.status})`);

    const stages = parseData(await response.text());
    if (stages.length === 0) throw new Error('equipment.txt に有効な装備データがありません。');
    processData(stages);
  } catch (err) {
    document.getElementById('calcResult').innerHTML =
      '<p data-style="s026">装備データを読み込めませんでした。ローカル HTTP サーバー経由で開いてください。</p>';
    console.error(err);
  }
}

init();
</script>
